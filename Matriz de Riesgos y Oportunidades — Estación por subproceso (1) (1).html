<header><h1>Matriz de Riesgos y Oportunidades — Estación reutilizable por subproceso</h1><p>EPG-CP-P04-F01 · Estación de trabajo ISO 31000 / ISO 9001 · Fundación Universitaria del Área Andina</p></header>

<script>
const EJ={sub:"OPCIONES DE GRADO",lid:"Patricia Díaz - Angela Puentes",

["R2","Riesgo","Cumplimiento normativo","Aplicación no homogénea de la normativa (Acuerdo 086, reglamento estudiantil, lineamientos) entre programas y sedes","Planear / Gestionar selección","Riesgo declarado en la caracterización","EXISTENTE"],
["R3","Riesgo","Tecnológico / Seguridad de la información","Pérdida o dispersión de información (formatos, actas, evidencias) por falta de centralización","Gestionar, Acompañar","Riesgo declarado en la caracterización","EXISTENTE"],
["R4","Riesgo","Operativo","Incumplimiento de tiempos en la formalización, el seguimiento y la evaluación de la opción de grado","Gestionar, Acompañar, Evaluar","Riesgo declarado; el indicador de tiempos lo confirma","EXISTENTE"],
["R5","Riesgo","Operativo","Falta de trazabilidad completa en los registros de la opción de grado","Gestionar, Evaluar, Analizar","Riesgo declarado; indicador de % de registros con trazabilidad","EXISTENTE"],
["R6","Riesgo","Cumplimiento normativo","Habilitación indebida o tardía del estudiante por verificación incompleta de requisitos académicos y administrativos","Gestionar selección y formalización","Punto crítico de la cadena Estudiante → Registro y Control → Estudiante habilitado","PROPUESTO"],
["R7","Riesgo","Tecnológico / Seguridad de la información","Registro erróneo o extemporáneo de resultados de evaluación en sistemas académicos","Evaluar, aprobar y registrar","Salida crítica hacia Registro y Control; afecta grado del estudiante","PROPUESTO"],
["R8","Riesgo","Operativo","Criterios de evaluación no unificados entre jurados/evaluadores y sedes (cobertura nacional)","Evaluar, aprobar y registrar","Cobertura nacional multicampus con rúbricas por modalidad","PROPUESTO"],
["O1","Oportunidad","Estratégico","Estandarización institucional del modelo de opciones de grado","Planear","Oportunidad declarada en la caracterización","EXISTENTE"],
["O2","Oportunidad","Tecnológico / Seguridad de la información","Centralización de la información de opciones de grado","Gestionar, Acompañar","Oportunidad declarada en la caracterización","EXISTENTE"],
["O3","Oportunidad","Tecnológico / Seguridad de la información","Automatización de solicitudes, seguimiento y registro","Gestionar, Acompañar, Evaluar","Oportunidad declarada en la caracterización","EXISTENTE"],
["O4","Oportunidad","Operativo","Optimización de tiempos de gestión","Gestionar, Evaluar","Oportunidad declarada en la caracterización","EXISTENTE"],
["O5","Oportunidad","Reputacional / Imagen institucional","Fortalecimiento del seguimiento y de la experiencia del estudiante","Acompañar, Analizar","Oportunidad declarada en la caracterización","EXISTENTE"]];
const blank=a=>({c:a[0],t:a[1],cat:a[2],d:a[3],act:a[4],just:a[5],src:a[6],ok:true,causa:"",cons:"",resp:"",pi:"",ii:"",ctl:"",tc:"",fc:"",acc:"",racc:"",fa:"",pe:"",ie:"",fe:""});
let S={rows:[],val:false,sel:0,tab:0},DB={cur:"",items:{}};
try{const x=localStorage.getItem("mrog2");if(x){DB=JSON.parse(x);const i=DB.items[DB.cur];if(i){S=i.S;CTX=i.CTX}}}catch(e){}
const sv=()=>{try{const k=CTX.sub||DB.cur||"Sin nombre";if(DB.cur&&DB.cur!==k)delete DB.items[DB.cur];DB.cur=k;DB.items[k]={S,CTX};localStorage.setItem("mrog2",JSON.stringify(DB))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const K=r=>r.t==="Oportunidad"?1:0,V=x=>x===""||x==null?null:+x+1,lvI=n=>n<4?"Bajo":n<7?"Medio":"Alto",lvR=n=>n<10?"Bajo":n<20?"Medio":"Alto";
function calc(r){const p=V(r.pi),i=V(r.ii),c=V(r.fc),pe=V(r.pe),ie=V(r.ie),ce=V(r.fe),inh=p&&i?p*i:null,res=inh&&c?inh*c:null,ob=pe&&ie&&ce?pe*ie*ce:null;
const lr=res?lvR(res):"";return{p,i,c,pe,ie,ce,inh,res,ob,li:inh?lvI(inh):"",lr,lo:ob?lvR(ob):"",req:!lr?"":lr==="Alto"?"Sí - obligatorio":lr==="Medio"?"Evaluar / recomendado":"No requerido"}}
const bg=(l,n)=>l?`<span class="bd ${l}">${n}: ${l}</span>`:"";
const act=()=>S.rows.filter(r=>r.ok);
function nav(){$("#nav").innerHTML=["1 · Subproceso e insumos","2 · Etapa 4: validar listado","3 · Matriz (etapas 5-10)","4 · Entregables"].map((t,i)=>`<button class="${S.tab===i?"on":""}" onclick="S.tab=${i};sv();draw()">${t}</button>`).join("")}
function draw(){nav();[t1,t2,t3,t4][S.tab]()}
const fn=()=>(CTX.sub||"subproceso").trim().replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,"_");
async function pdfText(f){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n"}return t}
async function xText(fs){let t="";for(const f of fs){const w=XLSX.read(await f.arrayBuffer());w.SheetNames.forEach(n=>{t+="### "+f.name+" / "+n+"\n"+XLSX.utils.sheet_to_csv(w.Sheets[n])+"\n"})}return t.slice(0,15000)}
async function an(sm){const f=$("#fp").files[0],st=$("#as");if(!f){st.textContent="Adjunte primero la caracterización en PDF.";return}
try{st.textContent="Leyendo insumos…";const pt=await pdfText(f),xf=$("#fx").files,xt=xf.length?await xText(xf):"";st.textContent="Analizando con Claude…";
const o=await sm.json(`Eres Arquitecto Senior en gestión de riesgos y procesos (ISO 31000/ISO 9001) de una universidad multicampus. Del texto de una CARACTERIZACIÓN de subproceso${xt?" y de matrices previas por procedimiento":""} extrae los datos y formula el listado preliminar de riesgos y oportunidades. Reglas: no inventes datos; si el nombre del subproceso es un marcador de plantilla (p. ej. NOMBRE DEL SUBPROCESO) deduce uno corto a partir del objetivo; los riesgos/oportunidades que aparezcan en la caracterización o en las matrices previas llevan src EXISTENTE (consolida duplicados y reformula: evento incierto + causa + efecto); agrega entre 3 y 5 elementos PROPUESTO que cubran fallas operativas, tecnológicas, humanas, legales, proveedores, articulación multicampus, continuidad y seguridad de la información; máximo 16 elementos. Cada elemento: c (R1.. u O1..), t (Riesgo u Oportunidad), cat (una de: ${CAT.join("; ")}), d (descripción corta), act (actividad o paso relacionado), just (justificación breve), src (EXISTENTE o PROPUESTO). Responde SOLO JSON: {sub,lid,cob (tipo de proceso y cobertura),obj,alc,phva:[[ciclo,actividad,"proveedores/entradas → salidas/clientes"]],docs,ind,items:[...]}.\n\nCARACTERIZACIÓN:\n${pt.slice(0,30000)}${xt?"\n\nMATRICES PREVIAS:\n"+xt:""}`,{cache:false});
sv();DB.cur="";CTX=Object.assign(emp(),{sub:o.sub||"",lid:o.lid||"",cob:o.cob||"",obj:o.obj||"",alc:o.alc||"",docs:o.docs||"",ind:o.ind||"",phva:Array.isArray(o.phva)?o.phva:[]});
S={rows:(o.items||[]).map(i=>blank([i.c,i.t==="Oportunidad"?"Oportunidad":"Riesgo",CAT.includes(i.cat)?i.cat:"Operativo",i.d,i.act||"",i.just||"",SRC.includes(i.src)?i.src:"PROPUESTO"])),val:false,sel:0,tab:1,a3:!!xt};sv();draw()}
catch(e){st.textContent="Error: "+(e.code||e.message)}}
function t1(){t1old();const ed=[["sub","Subproceso"],["lid","Líder(es)"],["cob","Tipo de proceso y cobertura"],["obj","Objetivo"],["alc","Alcance"],["docs","Documentos asociados"],["ind","Indicadores"]];
$("#m").insertAdjacentHTML("afterbegin",`<div class="card"><h3>Subprocesos guardados en este navegador</h3><select id="sp"><option value="">— seleccionar —</option>${Object.keys(DB.items).map(x=>`<option ${x===DB.cur?"selected":""}>${esc(x)}</option>`).join("")}</select><br><button class="b s" id="nw">+ Nuevo subproceso</button><button class="b s" id="ex">Cargar ejemplo Opciones de Grado</button><button class="b s" id="dl">Eliminar el actual</button>
<h3>Insumos del subproceso</h3><label>Caracterización (PDF)<input type="file" id="fp" accept=".pdf"></label><label>Matrices previas por procedimiento (xlsx, opcional)<input type="file" id="fx" accept=".xlsx,.xls" multiple></label><button class="b" id="an" hidden>✨ Analizar insumos con Claude (etapas 1-3)</button> <span id="as" class="tag"></span>
<h3>Datos del subproceso (editables)</h3>${ed.map(([k,l])=>`<label>${l}<textarea data-c="${k}" rows="${["sub","lid","cob"].includes(k)?1:3}">${esc(CTX[k])}</textarea></label>`).join("")}</div>`);
$("#m").oninput=e=>{const k=e.target.dataset.c;if(k){CTX[k]=e.target.value;sv()}};
$("#sp").onchange=e=>{const i=DB.items[e.target.value];if(i){sv();DB.cur=e.target.value;S=i.S;CTX=i.CTX;draw()}};
const nw=(c,r)=>{sv();DB.cur="";CTX=c;S={rows:r,val:false,sel:0,tab:0};sv();draw()};
$("#nw").onclick=()=>nw(emp(),[]);$("#ex").onclick=()=>nw(JSON.parse(JSON.stringify(EJ)),seed.map(blank));
$("#dl").onclick=()=>{delete DB.items[DB.cur];const k=Object.keys(DB.items)[0];if(k){DB.cur=k;S=DB.items[k].S;CTX=DB.items[k].CTX}else{DB.cur="";CTX=emp();S={rows:[],val:false,sel:0,tab:0}}try{localStorage.setItem("mrog2",JSON.stringify(DB))}catch(e){}draw()};
if(window.claude)claude.use("sample").then(sm=>{const b=$("#an");if(sm&&b)b.hidden=false,b.onclick=()=>an(sm)})}
function t1old(){$("#m").innerHTML=`<div class="card"><h3>Subproceso</h3><b>${CTX.sub}</b> · Líder: ${CTX.lid} · ${CTX.cob} <span class="tag">[EXISTENTE]</span><h3>Objetivo</h3>${CTX.obj}<h3>Alcance</h3>${CTX.alc}</div>
<div class="card sc"><h3>Cadena lógica Proveedor → Entrada → Actividad → Salida → Cliente (Etapa 1)</h3><table><tr><th>PHVA</th><th>Actividad</th><th>Cadena</th></tr>${CTX.phva.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join("")}</table></div>
<div class="card"><h3>Documentos asociados</h3>${CTX.docs}<h3>Indicadores</h3>${CTX.ind}<h3>Etapa 2 — Matrices preexistentes</h3>${S.a3?"Se adjuntaron matrices previas (Archivo 3): se aplica la Opción A (consolidación y depuración).":"No se adjuntó el Archivo 3: se aplica la Opción B (listado propuesto desde la caracterización)."} Los riesgos y oportunidades declarados en la caracterización se marcan [EXISTENTE]; los adicionales, [PROPUESTO].<h3>Campos reservados</h3>Proceso, Sistemas de Gestión, Fecha de identificación y Seguimiento se dejan vacíos en la exportación (Equipo de Procesos).</div>`}
function t2(){const o=a=>a.map(x=>`<option>${x}</option>`).join("");
$("#m").innerHTML=`<div class="card sc"><b>Listado preliminar de riesgos y oportunidades</b> — edite, agregue o desmarque elementos.<table><tr><th>Incl.</th><th>Cód.</th><th>Tipo</th><th>Categoría</th><th>Descripción corta</th><th>Actividad / paso</th><th>Justificación</th><th>Fuente</th></tr>${S.rows.map((r,i)=>`<tr data-i="${i}"><td><input type="checkbox" data-k="ok" ${r.ok?"checked":""}></td><td><input data-k="c" value="${esc(r.c)}" size="4"></td><td><select data-k="t">${["Riesgo","Oportunidad"].map(x=>`<option ${x===r.t?"selected":""}>${x}</option>`).join("")}</select></td><td><select data-k="cat">${CAT.map(x=>`<option ${x===r.cat?"selected":""}>${x}</option>`).join("")}</select></td><td><textarea data-k="d" rows="3">${esc(r.d)}</textarea></td><td><textarea data-k="act" rows="3">${esc(r.act)}</textarea></td><td><textarea data-k="just" rows="3">${esc(r.just)}</textarea></td><td><select data-k="src">${SRC.map(x=>`<option ${x===r.src?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</table>
<button class="b s" id="add">+ Agregar elemento</button></div>
<div class="q"><b>¿Validas este listado preliminar como representativo y coherente con el subproceso?</b><br>Indica si deseas agregar, modificar o eliminar algún elemento antes de proceder al diligenciamiento detallado y cálculo de niveles residuales.<br><br><button class="b" id="vl">${S.val?"Listado validado ✓ — ir a la matriz":"Validar listado y continuar"}</button></div>`;
$("#add").onclick=()=>{const n=S.rows.filter(r=>r.t==="Riesgo").length+1;S.rows.push(blank(["R"+n,"Riesgo","Operativo","","","","PROPUESTO"]));sv();t2()};

const FM=[["Identificación",[["t","Tipo","sel",["Riesgo","Oportunidad"]],["cat","Categoría","sel",CAT],["causa","Causa (raíz) — por qué ocurre","ta"],["d","Descripción — qué ocurre","ta"],["cons","Consecuencia potencial — qué efecto tiene","ta"],["resp","Responsable (dueño)","in"]]],
["Valoración inherente (sin controles)",[["pi","Probabilidad","L","P"],["ii","Impacto","L","I"]]],
["Controles existentes",[["ctl","Control: qué, cómo, quién, cuándo, dónde, evidencia, acción ante desviación","ta"],["tc","Tipo de control","sel",TC],["fc","Fortaleza del control / estrategia","L","C"]]],
["Tratamiento",[["acc","Acción de tratamiento","ta"],["racc","Responsable de la acción","in"],["fa","Fecha objetivo","date"]]],
["Residual objetivo (tras tratamiento)",[["pe","Probabilidad esperada","L","P"],["ie","Impacto esperado","L","I"],["fe","Control esperado","L","C"]]]];
function fld(r,[k,l,ty,o]){const v=r[k]??"";let h;
if(ty==="sel")h=`<select data-k="${k}"><option value="">—</option>${o.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}</select>`;
else if(ty==="L")h=`<select data-k="${k}"><option value="">—</option>${L[o][K(r)].map((x,j)=>`<option value="${j}" ${v!==""&&+v===j?"selected":""}>${x}</option>`).join("")}</select>`;
else if(ty==="ta")h=`<textarea data-k="${k}" rows="3">${esc(v)}</textarea>`;else h=`<input data-k="${k}" type="${ty==="date"?"date":"text"}" value="${esc(v)}">`;

Elemento: ${r.c} (${r.t}, ${r.cat}): ${r.d}. Actividad relacionada: ${r.act}.

Responde SOLO JSON con claves: causa, d (formato: evento incierto + causa principal + efecto), cons, resp (cargo sugerido), pi (0=>3 meses,1=trimestre,2=diario/semanal), ii (0=invisible,1=no crítico/mejora interna,2=compromete o mejora la satisfacción del usuario), ctl (qué/cómo/quién/cuándo/dónde/evidencia/acción ante desviación, solo lo deducible; si no hay evidencia escribe "Sin control documentado en la caracterización [PENDIENTE DE VALIDACIÓN]"), tc (0 Preventivo,1 Detectivo,2 Correctivo,3 No aplica), fc (0 fuerte,1 débil,2 sin control), acc (acción concreta de tratamiento o "" si el residual es bajo), racc (responsable sugerido), pe, ie, fe (0-2, valores esperados tras el tratamiento).`;

catch(e){st.textContent="Error en "+r.c+": "+(e.code||e.message);if(e.code==="not_granted"||e.code==="rate_limited")break}}
